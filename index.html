<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="cadastro.js" method="post">
        <h1>Login</h1>
        <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>

        <span id="span1">
            <span class="material-icons">person</span>
            <label for="email"></label>
            <input type="email" name="email1" id="email" min="3" required placeholder="  seu e-mail">
        </span>
        <span id="span2">
            <span class="material-icons">key</span>
            <label for="senha"></label>
            <input type="password" name="senha1" id="senha" min="8" required placeholder="  sua senha">
        </span>

        <label for="entrar"></label>
        <input type="submit" name="entrar1" id="entrar" value="Entrar">

        <label for="esqueceu"></label>
        <a href="#">Esqueci minha senha</a>
    </form>
    <div id="imagem">

    </div>
</body>
</html>
